<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>CinnaGen EC Equipment</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔬</text></svg>">
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#14202b;--mu:#64748b;--bd:#e2e8f0;--ac:#0f766e;--acs:#ccfbf1;
--red:#b91c1c;--ov:#fef2f2;--ovb:#fecaca;--note:#fff7ed;--amb:#b45309;
--pm:#ea580c;--pms:#fff1e6;--ca:#2563eb;--cas:#e8f0ff;--pq:#059669;--pqs:#e3f8ef;--on:#fff;
--nd:#94a3b8;--nds:#f1f5f9;--sh:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.04)}
@media(prefers-color-scheme:dark){:root{--bg:#0d1419;--card:#16202a;--tx:#e6edf3;--mu:#8fa1b3;--bd:#263541;--ac:#2dd4bf;--acs:#12332f;
--red:#fca5a5;--ov:#2a1719;--ovb:#5b2326;--note:#2a2014;--amb:#fcd34d;
--pm:#fb923c;--pms:#33200f;--ca:#60a5fa;--cas:#14233f;--pq:#34d399;--pqs:#0f2f24;--on:#0b1218;
--nd:#64748b;--nds:#1b2631;--sh:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
header{background:var(--ac);color:#fff;padding:14px 16px 10px}
@media(prefers-color-scheme:dark){header{background:#0b3b36;color:#e6fffb}}
h1{margin:0;font-size:19px;letter-spacing:.2px}
header small{opacity:.85;font-size:12px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 8px;border-bottom:1px solid var(--bd)}
.wrap{max-width:1100px;margin:0 auto}
#q{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);outline:none}
#q:focus{border-color:var(--ac)}
.row{display:flex;gap:8px;margin-top:8px;overflow-x:auto;scrollbar-width:none;align-items:center}
.row::-webkit-scrollbar{display:none}
.chip,select{font:inherit;font-size:13px;padding:6px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
@media(prefers-color-scheme:dark){.chip.on{color:#04211e}}
#cnt{color:var(--mu);font-size:13px;padding:10px 14px 2px}
#list{display:grid;gap:10px;padding:8px 12px 40px;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;box-shadow:var(--sh)}
.card.ov{background:var(--ov);border-color:var(--ovb)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.eq{font-weight:700;font-size:17px;word-break:break-all}
.desc{color:var(--mu);font-size:13px;margin-top:2px}
.badges{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap}
.b-over{background:var(--ovb);color:var(--red)}
.b-nd{background:var(--nds);color:var(--mu);border:1px dashed var(--nd)}
.type{background:var(--acs);color:var(--ac)}
.loc{margin:8px 0;font-size:13.5px}
.loc b{font-weight:600}
/* ---- PM / CA / PQ : one fixed colour per type, always */
.PM{--c:var(--pm);--cs:var(--pms)}.CA{--c:var(--ca);--cs:var(--cas)}.PQ{--c:var(--pq);--cs:var(--pqs)}
.due{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.d{border-radius:12px;padding:7px 8px;font-size:12px;background:var(--cs);border:1px solid color-mix(in srgb,var(--c) 38%,transparent)}
.d h4{display:inline-block;margin:0 0 4px;padding:1px 9px;border-radius:99px;font-size:11px;letter-spacing:.5px;background:var(--c);color:var(--on)}
.d .v{font-weight:700;font-size:13px}
.d .s{color:var(--mu);margin-top:2px}
.d .late{color:var(--tx);font-weight:700}
.d.nd{background:var(--nds);border:1.5px dashed var(--nd)}
.d.nd h4{background:var(--nd);color:#fff}
.d.nd .v{color:var(--mu)}
.d.off{background:transparent;border:1px dashed var(--bd);opacity:.55}
.d.off h4{background:var(--bd);color:var(--mu)}
.note{background:var(--note);border-left:3px solid var(--amb);padding:6px 9px;border-radius:6px;font-size:13px;margin-top:6px}
details{margin-top:8px}
summary{cursor:pointer;color:var(--ac);font-size:13px;font-weight:600;padding:4px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;margin-top:4px}
.kv span:nth-child(odd){color:var(--mu)}
.empty{text-align:center;color:var(--mu);padding:40px 16px;grid-column:1/-1}
#more{margin:0 12px 40px;width:calc(100% - 24px);padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--ac);font:inherit;font-weight:600}
mark{background:#fde047;color:#000;border-radius:3px;padding:0 1px}
#tabs{background:var(--ac)}#tabs .wrap{display:flex;gap:4px;padding:0 12px}
#tabs button{flex:1;font:inherit;font-weight:600;color:#fff;background:none;border:0;border-bottom:3px solid transparent;padding:10px 4px;opacity:.75;cursor:pointer}
#tabs button.on{opacity:1;border-color:#fff}
@media(prefers-color-scheme:dark){#tabs{background:#0b3b36}}
.pill i{font-style:normal;font-size:11px;font-weight:700;border-radius:99px;padding:1px 6px;margin-left:6px;background:var(--ovb);color:var(--red)}
.pill i.g{background:var(--nds);color:var(--mu);border:1px dashed var(--nd);padding:0 6px}
.pill.on i{background:#fff}
#sum{padding:10px 14px 2px;color:var(--mu);font-size:13px}
.lbl{padding:12px 14px 4px;font-weight:700;font-size:13px;letter-spacing:.5px;color:var(--mu)}.lbl.o{color:var(--red)}
.td{margin:10px 12px;padding:6px 12px;border-radius:99px;background:var(--ac);color:#fff;text-align:center;font-size:12px;font-weight:700}
@media(prefers-color-scheme:dark){.td{color:#04211e}}
.rw{display:flex;gap:12px;background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--c);border-radius:14px;padding:10px 12px;margin:0 12px 8px;box-shadow:var(--sh)}
.rw.over{background:var(--ov);border-color:var(--ovb);border-left-color:var(--c)}
.rw.nd{background:var(--nds);border:1.5px dashed var(--nd);border-left:5px dashed var(--nd);box-shadow:none}
.dy{min-width:50px;text-align:center;line-height:1.1}.dy b{display:block;font-size:20px;color:var(--c)}.dy small{color:var(--mu);font-size:11px}
.rw.nd .dy b{color:var(--mu);font-size:16px}
.mu{color:var(--mu);font-size:13px}.rw .eq2{font-size:15px;cursor:pointer;color:var(--ac);word-break:break-all}
.ty{background:var(--c);color:var(--on)}
.rw.nd .ty{background:var(--c)}
#slist{max-width:760px;margin:0 auto;padding-bottom:40px}
</style>
</head>
<body>
<header><div class="wrap"><h1>🔬 CinnaGen EC Equipment</h1><small id="upd"></small></div></header>
<nav id="tabs"><div class="wrap"><button data-t="search" class="on">🔍 Search</button><button data-t="sup">👥 Supervisors</button></div></nav>
<section id="v-search"><div class="bar"><div class="wrap">
  <input id="q" type="search" placeholder="Search for . . . (equipment, room, supervisor, brand…)" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
  <div class="row">
    <button class="chip on" data-f="all">All</button>
    <button class="chip" data-f="over">Overdue</button>
    <button class="chip" data-f="soon">Due ≤ 90 days</button>
    <button class="chip" data-f="nodate">No date</button>
    <select id="sup"><option value="">All supervisors</option></select>
    <select id="typ"><option value="">All types</option></select>
  </div>
</div></div>
<div class="wrap"><div id="cnt"></div><div id="list"></div><button id="more" hidden></button></div></section>
<section id="v-sup" hidden>
<div class="bar"><div class="wrap"><div class="row" id="spills"></div>
<div class="row"><button class="chip on" data-ty="all">All types</button><button class="chip" data-ty="PM">PM</button><button class="chip" data-ty="CA">CA</button><button class="chip" data-ty="PQ">PQ</button>
<select id="win"><option value="30">Next 30 days</option><option value="60">Next 60 days</option><option value="90" selected>Next 90 days</option><option value="180">Next 180 days</option></select></div></div></div>
<div class="wrap"><div id="sum"></div><div id="slist"></div></div></section>
<script src="data.js"></script>
<script>
const D=window.EQ_DATA||{items:[],people:{}},$=s=>document.querySelector(s);
const today=new Date();today.setHours(0,0,0,0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isD=v=>/^\d{4}-\d\d-\d\d$/.test(v);
const fmt=v=>isD(v)?v.slice(8)+'.'+v.slice(5,7)+'.'+v.slice(0,4):esc(v??'—');
const days=v=>isD(v)?Math.round((new Date(v+'T00:00:00')-today)/864e5):null;
const who=a=>a?`<span title="${esc((D.people[a]||[''])[0])}${D.people[a]&&D.people[a][1]?' · ext '+D.people[a][1]:''}">${esc(a)}</span>`:'—';
const rel=n=>n===null?'':n<0?`${-n} d overdue`:n===0?'due today':`in ${n} d`;
const TY=['PM','CA','PQ'],UK={PM:'PM user',CA:'CA user',PQ:'VA user'};
// precompute search text + status
D.items.forEach(it=>{
  const t=TY.map(k=>days(it[k+' due date'])).filter(n=>n!==null);
  it._min=t.length?Math.min(...t):null;
  it._nd=it._nodate||[];
  it._txt=Object.entries(it).filter(([k])=>k!='_nodate'&&k!='_nd').map(([,v])=>isD(v)?v+' '+fmt(v):v).concat(['PM user','CA user','VA user'].map(k=>(D.people[it[k]]||[''])[0])).concat(it._nd.length?['no date','nodate',...it._nd.map(x=>x+' no date')]:[]).join(' ').toLowerCase();
});
const uniq=k=>[...new Set(D.items.map(i=>i[k]).filter(Boolean))].sort();
uniq('Supervisor').forEach(v=>$('#sup').add(new Option(v,v)));
uniq('Eq Type').forEach(v=>$('#typ').add(new Option(v,v)));
$('#upd').textContent=`Data updated ${fmt(D.updated)} · ${D.items.length} items`;
let flt='all',shown=60;
function card(it,open,terms){
  const hl=s=>{s=esc(s);terms.forEach(t=>{if(t.length>1)s=s.replace(new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>')});return s};
  const over=it._min!==null&&it._min<0;
  const due=TY.map(k=>{const v=it[k+' due date'],n=days(v),nd=it._nd.includes(k);
    if(!nd&&v==null)return `<div class="d off ${k}"><h4>${k}</h4><div class="v">—</div><div class="s">no label</div></div>`;
    const meta=`<div class="s">every ${it[k+' interval']??'—'} mo</div><div class="s">by ${who(it[it_u(k)])}</div><div class="s">signed ${fmt(it[k+' sign'])}</div>`;
    if(nd)return `<div class="d nd ${k}"><h4>${k}</h4><div class="v">No date</div><div class="s">has label, no due date</div>${meta}</div>`;
    return `<div class="d ${k}"><h4>${k}</h4><div class="v">${fmt(v)}</div><div class="s ${n<0?'late':''}">${rel(n)||'&nbsp;'}</div>${meta}</div>`}).join('');
  const notes=['Heads up','Heads up2','Change Loc'].filter(k=>it[k]).map(k=>`<div class="note"><b>${k}:</b> ${fmt(it[k])}</div>`).join('');
  const kv=[['Location',it.Location],['Room',`${it['Room Abrv']||'—'} (${it['Room Num']||'—'})`],['Supervisor',it.Supervisor],['Brand',it.Brand],['Code',it.Code],['Cal type',it['Cal type']],['VA user',null],['IQ date',it['IQ date']],['OQ date',it['OQ date']],['PQ sign date',it['PQ Sign date']]]
   .map(([a,b])=>a=='VA user'?`<span>VA user</span><span>${who(it['VA user'])}</span>`:`<span>${a}</span><span>${fmt(b)}</span>`).join('');
  return `<article class="card${over?' ov':''}"><div class="top"><div><div class="eq">${hl(it.Equipment)}</div><div class="desc">${hl(it.Description||'—')}${it.Brand?' · '+hl(it.Brand):''}</div></div>
  <div class="badges"><span class="badge type">${hl(it['Eq Type']||'')}</span>${over?'<span class="badge b-over">Overdue</span>':''}${it._nd.length?`<span class="badge b-nd">No date: ${it._nd.join(', ')}</span>`:''}</div></div>
  <div class="loc">📍 <b>${hl(it['Room Abrv']||'—')}</b> · ${hl(it['Room Num']||'')} · ${hl(it.Location||'')} · 👤 ${hl(it.Supervisor||'—')}</div>
  <div class="due">${due}</div>${notes}
  <details${open?' open':''}><summary>All details</summary><div class="kv">${kv}</div></details></article>`;
}
function it_u(k){return UK[k]}
function render(){
  const terms=$('#q').value.toLowerCase().split(/\s+/).filter(Boolean),sup=$('#sup').value,typ=$('#typ').value;
  let r=D.items.filter(it=>terms.every(t=>it._txt.includes(t))&&(!sup||it.Supervisor===sup)&&(!typ||it['Eq Type']===typ)
    &&(flt=='all'||(flt=='nodate'?it._nd.length>0:(it._min!==null&&(flt=='over'?it._min<0:it._min>=0&&it._min<=90)))));
  if(flt=='over'||flt=='soon')r.sort((a,b)=>a._min-b._min);
  $('#cnt').textContent=`${r.length} result${r.length==1?'':'s'}`;
  $('#list').innerHTML=r.length?r.slice(0,shown).map(it=>card(it,r.length<=2,terms)).join(''):'<div class="empty">Nothing found. Try fewer words.</div>';
  const mb=$('#more');mb.hidden=r.length<=shown;mb.textContent=`Show more (${r.length-shown} left)`;
}
const go=()=>{shown=60;render()};
$('#q').addEventListener('input',go);$('#sup').onchange=go;$('#typ').onchange=go;
$('#more').onclick=()=>{shown+=60;render()};
document.querySelectorAll('#v-search .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#v-search .chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');flt=b.dataset.f;go()});
render();
// ---- Supervisors tab: every PM/CA/PQ due date = one row; labels without a date (grey in Excel) get their own list
const recs=[],nds=[];
D.items.forEach(it=>{TY.forEach(t=>{const v=it[t+' due date'];if(isD(v))recs.push({it,t,v,n:days(v)})});it._nd.forEach(t=>nds.push({it,t}))});
recs.sort((a,b)=>a.v<b.v?-1:a.v>b.v?1:a.it.Equipment<b.it.Equipment?-1:1);
nds.sort((a,b)=>a.it.Equipment<b.it.Equipment?-1:a.it.Equipment>b.it.Equipment?1:a.t<b.t?-1:1);
let sSel='all',sTy='all';const sups=uniq('Supervisor');
const meta=(it,t)=>`every ${it[t+' interval']??'—'} mo · by ${who(it[UK[t]])} · last signed ${fmt(it[t+' sign'])}`;
const head=(it)=>`<div class="mu">${esc(it.Description||'')}${it.Brand?' · '+esc(it.Brand):''}</div><div class="mu">📍 ${esc(it['Room Abrv']||'')} ${esc(it['Room Num']||'')} · ${esc(it.Location||'')}${sSel=='all'?' · 👤 '+esc(it.Supervisor||''):''}</div>`;
const row=r=>{const{it,t,n}=r;return `<div class="rw ${t}${n<0?' over':''}"><div class="dy"><b>${n<0?'−'+-n:n}</b><small>${n<0?'days late':n==0?'today':'days'}</small></div><div><div><b class="eq2" data-e="${esc(it.Equipment)}">${esc(it.Equipment)}</b> <span class="badge ty">${t}</span> <span class="mu">${fmt(r.v)}</span></div>${head(it)}<div class="mu">${meta(it,t)}</div></div></div>`};
const ndrow=r=>{const{it,t}=r;return `<div class="rw nd ${t}"><div class="dy"><b>—</b><small>no date</small></div><div><div><b class="eq2" data-e="${esc(it.Equipment)}">${esc(it.Equipment)}</b> <span class="badge ty">${t}</span> <span class="mu">has label · no due date</span></div>${head(it)}<div class="mu">${meta(it,t)}</div></div></div>`};
function renderS(){
  const W=+$('#win').value,ok=r=>(sSel=='all'||r.it.Supervisor==sSel)&&(sTy=='all'||r.t==sTy);
  const L=recs.filter(ok),N=nds.filter(ok);
  const ov=L.filter(r=>r.n<0),inc=L.filter(r=>r.n>=0&&r.n<=W);
  $('#spills').innerHTML=['all',...sups].map(s=>{const sel=r=>s=='all'||r.it.Supervisor==s,o=recs.filter(r=>r.n<0&&sel(r)).length,g=nds.filter(sel).length;
    return `<button class="chip pill ${s==sSel?'on':''}" data-s="${s}">${s=='all'?'All':s}${o?`<i title="overdue">${o}</i>`:''}${g?`<i class="g" title="no date">${g}</i>`:''}</button>`}).join('');
  $('#sum').textContent=`${sSel=='all'?'All supervisors':sSel}: ${ov.length} overdue · ${inc.length} incoming in next ${W} days · ${N.length} label${N.length==1?'':'s'} without date`;
  $('#slist').innerHTML=(ov.length?`<div class="lbl o">OVERDUE (${ov.length})</div>`+ov.map(row).join(''):'')
   +`<div class="td">Today · ${String(today.getDate()).padStart(2,'0')}.${String(today.getMonth()+1).padStart(2,'0')}.${today.getFullYear()}</div>`
   +(inc.length?`<div class="lbl">INCOMING (${inc.length})</div>`+inc.map(row).join(''):'<div class="empty">Nothing due in this window 🎉</div>')
   +(N.length?`<div class="lbl">NO DATE · HAS LABEL (${N.length})</div>`+N.map(ndrow).join(''):'');
}
$('#spills').onclick=e=>{const b=e.target.closest('[data-s]');if(b){sSel=b.dataset.s;renderS()}};
$('#slist').onclick=e=>{const b=e.target.closest('[data-e]');if(b){$('#q').value=b.dataset.e;go();show('search');scrollTo(0,0)}};
$('#win').onchange=renderS;
document.querySelectorAll('[data-ty]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-ty]').forEach(x=>x.classList.remove('on'));b.classList.add('on');sTy=b.dataset.ty;renderS()});
function show(t){['search','sup'].forEach(k=>$('#v-'+k).hidden=k!=t);document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));history.replaceState(null,'','#'+t);if(t=='sup')renderS()}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>show(b.dataset.t));
if(location.hash=='#sup')show('sup');
</script>
</body>
</html>
