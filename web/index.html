<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>CinnaGen EC Equipment</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔬</text></svg>">
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#14202b;--mu:#64748b;--bd:#e2e8f0;--ac:#0f766e;--acs:#ccfbf1;--red:#b91c1c;--reds:#fee2e2;--amb:#b45309;--ambs:#fef3c7;--grn:#15803d;--grns:#dcfce7;--note:#fff7ed}
@media(prefers-color-scheme:dark){:root{--bg:#0d1419;--card:#16202a;--tx:#e6edf3;--mu:#8fa1b3;--bd:#263541;--ac:#2dd4bf;--acs:#12332f;--red:#fca5a5;--reds:#3b1616;--amb:#fcd34d;--ambs:#3a2c0c;--grn:#86efac;--grns:#123020;--note:#2a2014}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
header{background:var(--ac);color:#fff;padding:14px 16px 10px}
@media(prefers-color-scheme:dark){header{background:#0b3b36;color:#e6fffb}}
h1{margin:0;font-size:19px;letter-spacing:.2px}
header small{opacity:.85;font-size:12px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 8px;border-bottom:1px solid var(--bd)}
.wrap{max-width:1100px;margin:0 auto}
#q{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);outline:none}
#q:focus{border-color:var(--ac)}
.row{display:flex;gap:8px;margin-top:8px;overflow-x:auto;scrollbar-width:none;align-items:center}
.row::-webkit-scrollbar{display:none}
.chip,select{font:inherit;font-size:13px;padding:6px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
@media(prefers-color-scheme:dark){.chip.on{color:#04211e}}
#cnt{color:var(--mu);font-size:13px;padding:10px 14px 2px}
#list{display:grid;gap:10px;padding:8px 12px 40px;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.eq{font-weight:700;font-size:17px;word-break:break-all}
.desc{color:var(--mu);font-size:13px;margin-top:2px}
.badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap}
.b-over{background:var(--reds);color:var(--red)}.b-soon{background:var(--ambs);color:var(--amb)}.b-ok{background:var(--grns);color:var(--grn)}.b-na{background:var(--bd);color:var(--mu)}
.type{background:var(--acs);color:var(--ac);margin-right:4px}
.loc{margin:8px 0;font-size:13.5px}
.loc b{font-weight:600}
.due{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.d{border-radius:10px;padding:7px 8px;font-size:12px;background:var(--bg);border:1px solid var(--bd)}
.d h4{margin:0 0 3px;font-size:11px;color:var(--mu);letter-spacing:.5px}
.d .v{font-weight:700;font-size:13px}
.d.over{background:var(--reds);border-color:transparent}.d.over .v{color:var(--red)}
.d.soon{background:var(--ambs);border-color:transparent}.d.soon .v{color:var(--amb)}
.d .s{color:var(--mu);margin-top:2px}
.note{background:var(--note);border-left:3px solid var(--amb);padding:6px 9px;border-radius:6px;font-size:13px;margin-top:6px}
details{margin-top:8px}
summary{cursor:pointer;color:var(--ac);font-size:13px;font-weight:600;padding:4px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;margin-top:4px}
.kv span:nth-child(odd){color:var(--mu)}
.empty{text-align:center;color:var(--mu);padding:40px 16px;grid-column:1/-1}
#more{margin:0 12px 40px;width:calc(100% - 24px);padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--ac);font:inherit;font-weight:600}
mark{background:#fde047;color:#000;border-radius:3px;padding:0 1px}
</style>
</head>
<body>
<header><div class="wrap"><h1>🔬 CinnaGen EC Equipment</h1><small id="upd"></small></div></header>
<div class="bar"><div class="wrap">
  <input id="q" type="search" placeholder="Search for . . . (equipment, room, supervisor, brand…)" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
  <div class="row">
    <button class="chip on" data-f="all">All</button>
    <button class="chip" data-f="over">Overdue</button>
    <button class="chip" data-f="soon">Due ≤ 90 days</button>
    <select id="sup"><option value="">All supervisors</option></select>
    <select id="typ"><option value="">All types</option></select>
  </div>
</div></div>
<div class="wrap"><div id="cnt"></div><div id="list"></div><button id="more" hidden></button></div>
<script src="data.js"></script>
<script>
const D=window.EQ_DATA||{items:[],people:{}},$=s=>document.querySelector(s);
const today=new Date();today.setHours(0,0,0,0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isD=v=>/^\d{4}-\d\d-\d\d$/.test(v);
const fmt=v=>isD(v)?v.slice(8)+'.'+v.slice(5,7)+'.'+v.slice(0,4):esc(v??'—');
const days=v=>isD(v)?Math.round((new Date(v+'T00:00:00')-today)/864e5):null;
const who=a=>a?`<span title="${esc((D.people[a]||[''])[0])}${D.people[a]&&D.people[a][1]?' · ext '+D.people[a][1]:''}">${esc(a)}</span>`:'—';
const rel=n=>n===null?'':n<0?`${-n} d overdue`:n===0?'due today':`in ${n} d`;
const cls=n=>n===null?'':n<0?'over':n<=90?'soon':'';
// precompute search text + status
D.items.forEach(it=>{
  const t=['PM','CA','PQ'].map(k=>days(it[k+' due date'])).filter(n=>n!==null);
  it._min=t.length?Math.min(...t):null;
  it._txt=Object.values(it).map(v=>isD(v)?v+' '+fmt(v):v).concat(['PM user','CA user','VA user'].map(k=>(D.people[it[k]]||[''])[0])).join(' ').toLowerCase();
});
const uniq=k=>[...new Set(D.items.map(i=>i[k]).filter(Boolean))].sort();
uniq('Supervisor').forEach(v=>$('#sup').add(new Option(v,v)));
uniq('Eq Type').forEach(v=>$('#typ').add(new Option(v,v)));
$('#upd').textContent=`Data updated ${fmt(D.updated)} · ${D.items.length} items`;
let flt='all',shown=60;
function card(it,open,terms){
  const hl=s=>{s=esc(s);terms.forEach(t=>{if(t.length>1)s=s.replace(new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>')});return s};
  const m=it._min,bd=m===null?['b-na','No due date']:m<0?['b-over','Overdue']:m<=90?['b-soon','Due soon']:['b-ok','OK'];
  const due=['PM','CA','PQ'].map(k=>{const v=it[k+' due date'],n=days(v);
    return `<div class="d ${cls(n)}"><h4>${k}</h4><div class="v">${fmt(v)}</div><div class="s">${rel(n)||'&nbsp;'}</div>
    <div class="s">every ${it[k+' interval']??'—'} mo</div><div class="s">by ${who(it[k=='PM'?'PM user':k=='CA'?'CA user':'VA user'])}</div><div class="s">signed ${fmt(it[k+' sign'])}</div></div>`}).join('');
  const notes=['Heads up','Heads up2','Change Loc'].filter(k=>it[k]).map(k=>`<div class="note"><b>${k}:</b> ${fmt(it[k])}</div>`).join('');
  const kv=[['Location',it.Location],['Room',`${it['Room Abrv']||'—'} (${it['Room Num']||'—'})`],['Supervisor',it.Supervisor],['Brand',it.Brand],['Code',it.Code],['Cal type',it['Cal type']],['VA user',null],['IQ date',it['IQ date']],['OQ date',it['OQ date']],['PQ sign date',it['PQ Sign date']]]
   .map(([a,b])=>a=='VA user'?`<span>VA user</span><span>${who(it['VA user'])}</span>`:`<span>${a}</span><span>${fmt(b)}</span>`).join('');
  return `<article class="card"><div class="top"><div><div class="eq">${hl(it.Equipment)}</div><div class="desc">${hl(it.Description||'—')}${it.Brand?' · '+hl(it.Brand):''}</div></div>
  <div><span class="badge type">${hl(it['Eq Type']||'')}</span><span class="badge ${bd[0]}">${bd[1]}</span></div></div>
  <div class="loc">📍 <b>${hl(it['Room Abrv']||'—')}</b> · ${hl(it['Room Num']||'')} · ${hl(it.Location||'')} · 👤 ${hl(it.Supervisor||'—')}</div>
  <div class="due">${due}</div>${notes}
  <details${open?' open':''}><summary>All details</summary><div class="kv">${kv}</div></details></article>`;
}
function render(){
  const terms=$('#q').value.toLowerCase().split(/\s+/).filter(Boolean),sup=$('#sup').value,typ=$('#typ').value;
  let r=D.items.filter(it=>terms.every(t=>it._txt.includes(t))&&(!sup||it.Supervisor===sup)&&(!typ||it['Eq Type']===typ)
    &&(flt=='all'||(it._min!==null&&(flt=='over'?it._min<0:it._min>=0&&it._min<=90))));
  if(flt!="all")r.sort((a,b)=>a._min-b._min);
  $('#cnt').textContent=`${r.length} result${r.length==1?'':'s'}`;
  $('#list').innerHTML=r.length?r.slice(0,shown).map(it=>card(it,r.length<=2,terms)).join(''):'<div class="empty">Nothing found. Try fewer words.</div>';
  const mb=$('#more');mb.hidden=r.length<=shown;mb.textContent=`Show more (${r.length-shown} left)`;
}
const go=()=>{shown=60;render()};
$('#q').addEventListener('input',go);$('#sup').onchange=go;$('#typ').onchange=go;
$('#more').onclick=()=>{shown+=60;render()};
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');flt=b.dataset.f;go()});
render();
</script>
</body>
</html>
